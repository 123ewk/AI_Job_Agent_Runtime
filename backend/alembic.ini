# Alembic config
# Commands (run from backend/):
#   uv run alembic upgrade head        # apply migrations
#   uv run alembic downgrade -1        # revert one revision
#   uv run alembic revision --autogenerate -m "msg"
# sqlalchemy.url is intentionally empty; alembic/env.py injects it from Settings
# to avoid hardcoding credentials here.
# NOTE: keep this file ASCII-only; configparser reads it with the locale encoding
# on Windows, which breaks on non-ASCII (e.g. UTF-8 Chinese) comments.

[alembic]
script_location = alembic
prepend_sys_path = .
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S

# AI 求职 Agent - 本地开发基础设施编排
# 启动：docker compose -f deploy/docker-compose.yml up -d
# 关闭：docker compose -f deploy/docker-compose.yml down
# 变量默认值与根目录 .env.example 对齐；在根目录放 .env 可覆盖。
# 注意：从仓库根目录执行命令，docker compose 会自动读取根目录的 .env。

name: ai-career-copilot

services:
  # ---------------- PostgreSQL + pgvector ----------------
  # pgvector/pgvector 镜像自带 vector 扩展，迁移中 CREATE EXTENSION vector 即可启用。
  postgres:
    image: pgvector/pgvector:pg16
    container_name: ai-career-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ai_career}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-in-prod}
      POSTGRES_DB: ${POSTGRES_DB:-ai_career_dev}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ai_career} -d ${POSTGRES_DB:-ai_career_dev}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ---------------- Redis（缓存 + Stream 队列）----------------
  redis:
    image: redis:7-alpine
    container_name: ai-career-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ---------------- MinIO（对象存储）----------------
  minio:
    image: minio/minio:latest
    container_name: ai-career-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-ai_career_minio}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-change-me-in-prod}
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # 管理控制台
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ---------------- MinIO 初始化：自动创建 bucket ----------------
  minio-init:
    image: minio/mc:latest
    container_name: ai-career-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ACCESS_KEY:-ai_career_minio} ${MINIO_SECRET_KEY:-change-me-in-prod} &&
      mc mb --ignore-existing local/${MINIO_BUCKET:-ai-career-assets} &&
      echo 'bucket ${MINIO_BUCKET:-ai-career-assets} ready'
      "
    restart: "no"

volumes:
  postgres_data:
  redis_data:
  minio_data:

# skills/ 自包含 lint 配置：镜像 backend/pyproject.toml 的 [tool.ruff]，
# 使 `ruff check skills/` 在无根配置时也能与项目标准对齐（不随 ruff 默认集漂移）。
# 注：ruff.toml 顶层即配置段（仅 pyproject.toml 才用 [tool.ruff] 包裹）。
line-length = 120
target-version = "py312"

[lint]
select = [
    "E", "W", "F", "I", "N", "UP", "ANN", "S", "B", "C4", "DTZ", "T10", "EM",
    "ISC", "ICN", "G", "PIE", "T20", "Q", "RSE", "RET", "SIM", "TID", "ARG",
    "PTH", "ERA", "PL", "TRY", "FLY", "PERF", "FURB", "RUF",
]
ignore = [
    "S101",    # Use of assert detected
    "TRY003",
    "PLR0911", "PLR0912", "PLR0913", "PLR0915", "PLR2004",
    "PERF203",
    "RUF001",  # 中文全角标点（字符串）故意保留
    "RUF002",  # 中文全角标点（文档串）故意保留
    "RUF003",  # 中文全角标点（注释）故意保留
]
# 本工具为自包含目录，job_fit/service 视为 first-party（与 pytest 等第三方分组区分）
[lint.isort]
known-first-party = ["job_fit", "service"]

[format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

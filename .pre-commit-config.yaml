repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: check-added-large-files
        args: ["--maxkb=500"]
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: debug-statements
      - id: detect-private-key

  # ruff / mypy 通过 backend 项目的 uv 环境运行，确保 fastapi/sqlalchemy 等依赖可见，
  # 从而 mypy --strict 不会因缺少导入而误报。--directory backend 切换工作目录到 backend/，
  # 使工具能正确发现 backend/pyproject.toml 中的配置。
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check (backend)
        entry: uv run --directory backend ruff check --fix --exit-non-zero-on-fix .
        language: system
        files: ^backend/.*\.py$
        types: [python]
        pass_filenames: false
      - id: ruff-format
        name: ruff format (backend)
        entry: uv run --directory backend ruff format .
        language: system
        files: ^backend/.*\.py$
        types: [python]
        pass_filenames: false
      - id: mypy
        name: mypy (backend)
        entry: uv run --directory backend mypy app
        language: system
        files: ^backend/.*\.py$
        types: [python]
        pass_filenames: false

  - repo: https://github.com/crate-ci/typos
    rev: v1.27.3
    hooks:
      - id: typos
